{% extends "base.html" %}

{% block title %}Login - PrePlate Restaurant Management{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold"><span class="text-primary">Pre</span>Plate</h2>
                        <p class="text-muted">Restaurant Management System</p>
                    </div>
                    <h3 class="text-center mb-4">Login</h3>
                    <form method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Login</button>
                        </div>
                    </form>
                    <div class="text-center mt-4">
                        <p class="text-muted small">Default Admin: admin@preplate.com / Admin@123</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
